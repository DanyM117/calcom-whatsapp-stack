# 1. Bloqueo de acceso por IP directa
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# 2. Tráfico legítimo del dominio y subdominios
server {
    listen 80;
    server_name sv-solution.com *.sv-solution.com;

    client_max_body_size 20M;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Webhook de WhatsApp (preserva $request_uri y query strings de verificación de Meta)
    location /webhook/whatsapp {
        set $agent_upstream whatsapp-agent;
        proxy_pass http://$agent_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API v2 (rewrite explícito al usar variable de upstream)
    location /api/v2/ {
        set $api_upstream calcom-api;
        rewrite ^/api/v2/(.*)$ /v2/$1 break;
        proxy_pass http://$api_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 90s;
        proxy_read_timeout 90s;
    }

    # Frontend Web de Cal.com
    location / {
        set $web_upstream calcom;
        proxy_pass http://$web_upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
